<!DOCTYPE html>
<html>
<head>
    <title>NCNW Membership Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            padding: 30px;
        }

        /* CENTER CONTAINER */
        .container {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
            background-color: #262626;
            padding: 25px;
            border-radius: 10px;
        }

        .header img {
            width: 180px;
            margin-bottom: 10px;
        }

        h2 {
            color: #c084fc;
            margin-bottom: 20px;
        }

        /* INPUT FIELDS */
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            display: block;
            box-sizing: border-box;
        }

        textarea {
            height: 70px;
        }

        /* BUTTON */
        button {
            padding: 10px 16px;
            background-color: #9333ea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #7e22ce;
        }

        label {
            margin-top: 10px;
            display: block;
            font-size: 14px;
            color: #ccc;
            text-align: left;
        }

        /* OPTIONAL NOTE TEXT */
        .note {
            font-size: 12px;
            color: #bbb;
            margin-bottom: 15px;
            text-align: left;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="NCNW Logo">
    </div>

    <h2>Membership Application</h2>

    <form method="POST" action="/submit_application">

        <input type="text" name="first_name" placeholder="First Name" required>
        <input type="text" name="last_name" placeholder="Last Name" required>

        <input type="email" name="email" placeholder="Email" required>
        <input type="text" name="phone" placeholder="Phone">

        <input type="text" name="address" placeholder="Address">
        <input type="text" name="city" placeholder="City">
        <input type="text" name="state" placeholder="State">
        <input type="text" name="zip" placeholder="Zip">

        <label>Membership Type:</label>

        <p class="note">
            Note: $20 of each membership fee is allocated to local section dues. The remaining balance is submitted as national dues.
        </p>

        <select name="membership_type_id">
            <option value="1">Annual - $95</option>
            <option value="2">Life - $1,020</option>
            <option value="3">Legacy Life - $1,520</option>
        </select>

        <input type="text" name="member_status" placeholder="New / Renewal">

        <textarea name="comments" placeholder="Comments"></textarea>

        <button type="submit">Submit Application</button>

    </form>

</div>

</body>
</html>
