<!DOCTYPE html>
<html>
<head>
<title>Active Members</title>

<style>
body { font-family: Arial; background:#1a1a1a; color:white; padding:20px;}

.header {
    text-align:center;
    margin-bottom:20px;
}

.header img {
    width:200px;
    margin-bottom:10px;
}

h1 {
    color:#c084fc;
}

table { width:100%; background:#2a2a2a; border-collapse: collapse;}

th { background:#9333ea; padding:10px;}

td { padding:10px; border-bottom:1px solid #444;}

button { padding:6px 10px; border:none; cursor:pointer; }

/* REMOVE BUTTON COLOR */
.remove-btn {
    background-color:#ef4444;
    color:white;
}

.remove-btn:hover {
    background-color:#dc2626;
}

</style>
</head>

<body>

<div class="header">
    <img src="{{ url_for('static', filename='logo.png') }}">
    <h1>Active Members</h1>
</div>

<table>
<tr>
<th>Name</th>
<th>Email</th>
<th>Membership</th>
<th>Action</th>
</tr>

{% for member in members %}
<tr>
<td>{{ member['first_name'] }} {{ member['last_name'] }}</td>
<td>{{ member['email'] }}</td>
<td>{{ member['membership_type'] }}</td>

<td>
<form method="POST" action="/delete_member/{{ member['member_id'] }}">
<button class="remove-btn" type="submit">Remove</button>
</form>
</td>

</tr>
{% endfor %}

</table>

</body>
</html>
